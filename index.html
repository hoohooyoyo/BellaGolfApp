<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Golf App - 高尔夫数据录入</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Bella Golf App</h1>
            <div class="header-content">
                <div class="match-info">
                    <div class="info-row">
                        <div class="info-item">
                            <label>球员</label>
                            <input type="text" id="player-input" placeholder="输入球员姓名">
                        </div>
                        <div class="info-item">
                            <label>球场</label>
                            <input type="text" id="course-input" placeholder="输入球场名称">
                        </div>
                        <div class="info-item">
                            <label>日期</label>
                            <input type="date" id="date-input">
                        </div>
                    </div>
                </div>
                <nav>
                    <button id="export-btn" class="nav-btn">📥 数据导出</button>
                    <button id="import-btn" class="nav-btn">📤 数据导入</button>
                    <input type="file" id="import-file" accept=".csv" style="display: none;">
                    <button class="nav-btn active" data-tab="summary">统计分析</button>
                    <button class="nav-btn" data-tab="holes">成绩录入</button>
                    <button id="demo-btn" class="nav-btn">演示数据</button>
                    <button id="reset-btn" class="nav-btn reset-btn">重置数据</button>
                </nav>
            </div>
        </header>
        
        <main>
            <section id="summary-section" class="tab-content active">
                <div class="stats-container">
                    <!-- 计分卡 -->
               <div class="stats-category">
                   <h3 class="category-title">计分卡</h3>
                   <div class="scorecard-container" id="stats-scorecard"></div>
               </div>
                    
                    <!-- 开球 -->
                    <div class="stats-category">
                        <h3 class="category-title">开球</h3>
                        <div class="stats-grid" id="stats-driving"></div>
                    </div>
                    
                    <!-- 铁杆 (隐藏) -->
                    <div class="stats-category" style="display: none;">
                        <h3 class="category-title">铁杆</h3>
                        <div class="stats-grid" id="stats-irons"></div>
                    </div>
                    
                    <!-- 切杆 (隐藏) -->
                    <div class="stats-category" style="display: none;">
                        <h3 class="category-title">切杆</h3>
                        <div class="stats-grid" id="stats-chipping"></div>
                    </div>
                    
                    <!-- 推杆 -->
                    <div class="stats-category">
                        <h3 class="category-title">推杆</h3>
                        <div class="stats-grid" id="stats-putting"></div>
                    </div>
                </div>
            </section>
            
            <section id="holes-section" class="tab-content">
                <div class="hole-selector">
                    <div class="hole-tabs" id="hole-tabs">
                    </div>
                </div>
                <div class="hole-detail" id="hole-detail">
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2026 Bella Golf App</p>
        </footer>
    </div>
    <script src="src/app.js"></script>
</body>
</html>
